<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0F1011" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MOVA" />
  <title>MOVA</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="mova-icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="mova-logo.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="network-status" class="network-status" hidden aria-live="polite"></div>
  <main class="shell">
    <header class="brand-header">
      <img src="mova-logo.png" class="brand-logo" alt="MOVA — Movement made accessible." />
    </header>
    <section id="app" class="app" aria-live="polite"></section>
    <footer id="kit-footer" class="kit-footer"></footer>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
